<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voxly - Ask Infinitely</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #000000, #001a33, #002b66, #004488, #0088cc);
      background-size: 400% 400%;
      animation: gradientFlow 25s ease infinite;
      color: #dfffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
      transition: background 1s ease, color 1s ease;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .theme-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      width: 60px;
      height: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      color: #00ffe7;
      transition: all 0.3s ease;
    }

    .theme-toggle span {
      font-size: 1.1rem;
      pointer-events: none;
    }

    .branding {
      text-align: center;
      margin-bottom: 2rem;
    }

    .branding img {
      width: 130px;
      height: 130px;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 0 10px #00ffe7);
      transition: filter 1s ease;
    }

    .branding h1 {
      font-family: 'Orbitron', sans-serif;
      color: #00ffe7;
      font-size: 2rem;
      text-shadow: 0 0 10px #00ffe7;
      transition: color 1s ease, text-shadow 1s ease;
    }

    .branding .tagline {
      font-style: italic;
      color: #00ffe7;
      margin-top: 0.3rem;
      transition: color 1s ease;
    }

    .chatbox {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      width: 100%;
      max-width: 650px;
      padding: 2rem;
      box-shadow: 0 0 20px #00ffe744;
      transition: box-shadow 1s ease, background 1s ease;
    }

    select, textarea, button {
      width: 100%;
      font-size: 1rem;
      border-radius: 12px;
      border: none;
      outline: none;
      transition: all 0.3s ease;
    }

    select {
      padding: 0.7rem;
      background: #111;
      color: #0ff;
      margin-bottom: 1rem;
      box-shadow: 0 0 8px #00ffe744;
    }

    textarea {
      background: #111;
      color: #0ff;
      padding: 1rem;
      resize: none;
      min-height: 80px;
      box-shadow: 0 0 10px #00ffe766 inset;
      margin-bottom: 1rem;
    }

    .voice-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
    }

    button {
      background: #00ffe7;
      color: #000;
      padding: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 10px #00ffe744;
    }

    button:hover {
      box-shadow: 0 0 15px #00fff2;
      transform: translateY(-1px);
    }

    pre {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 1rem;
      color: #0ff;
      white-space: pre-wrap;
      box-shadow: 0 0 8px #00ffe766 inset;
      font-size: 1rem;
      min-height: 80px;
      overflow-y: auto;
      transition: background 1s ease, color 1s ease;
    }

    /* LIGHT MODE */
    body.light {
      background: linear-gradient(135deg, #ffffff, #e6e6ff, #ccd9ff, #b3c6ff, #99b3ff);
      background-size: 400% 400%;
      animation: gradientFlow 25s ease infinite;
      color: #001a33;
    }

    body.light .branding img {
      filter: drop-shadow(0 0 8px #667aff);
    }

    body.light .branding h1 {
      color: #3344cc;
      text-shadow: 0 0 8px #aab3ff;
    }

    body.light .branding .tagline {
      color: #3344cc;
    }

    body.light .chatbox {
      background: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 20px #aab3ff66;
    }

    body.light select,
    body.light textarea {
      background: #f3f4ff;
      color: #001a33;
      box-shadow: 0 0 8px #aab3ff66;
    }

    body.light button {
      background: #3344cc;
      color: #fff;
      box-shadow: 0 0 10px #aab3ff66;
    }

    body.light pre {
      background: rgba(255,255,255,0.6);
      color: #001a33;
      box-shadow: 0 0 8px #aab3ff66 inset;
    }

    body.light .theme-toggle {
      background: rgba(0, 0, 0, 0.1);
      color: #3344cc;
    }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle">
    <span>🌙</span><span>☀️</span>
  </div>

  <div class="branding">
    <img src="logo.png" alt="Voxly Logo" />
    <p class="tagline">: Education is power :</p>
    <h1>⚡ Voxly</h1>
    <p>Ask Infinitely. Learn Limitlessly.</p>
  </div>

  <div class="chatbox">
    <select id="language">
      <option value="en-IN">English (India)</option>
      <option value="en-US">English (US)</option>
      <option value="hi-IN">Hindi</option>
      <option value="ta-IN">Tamil</option>
      <option value="te-IN">Telugu</option>
      <option value="bn-IN">Bengali</option>
      <option value="ml-IN">Malayalam</option>
      <option value="mr-IN">Marathi</option>
      <option value="gu-IN">Gujarati</option>
      <option value="kn-IN">Kannada</option>
      <option value="pa-IN">Punjabi</option>
      <option value="ur-IN">Urdu</option>
      <option value="es-ES">Spanish</option>
      <option value="fr-FR">French</option>
      <option value="de-DE">German</option>
      <option value="ru-RU">Russian</option>
      <option value="ar-SA">Arabic</option>
      <option value="ja-JP">Japanese</option>
      <option value="zh-CN">Chinese</option>
    </select>

    <textarea id="prompt" placeholder="Ask Gemini anything..."></textarea>

    <div class="voice-btns">
      <button onclick="startListening()">🎙️ Speak</button>
      <button onclick="askGemini()">✨ Send</button>
      <button onclick="stopSpeaking()">🛑 Stop</button>
    </div>

    <pre id="response">Your response will appear here...</pre>

    <div style="margin-top:1rem;">
      <button onclick="speakLastResponse()">🔊 Speak Again</button>
    </div>
  </div>

  <script>
    const body = document.body;
    const toggle = document.getElementById('themeToggle');
    toggle.addEventListener('click', () => {
      body.classList.toggle('light');
    });

    let synth = window.speechSynthesis;
    let currentUtterance = null;
    let lastResponse = "";

    function getSelectedLang() {
      stopSpeaking();
      return document.getElementById("language").value;
    }

    function startListening() {
      const lang = getSelectedLang();
      stopSpeaking();
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = lang;
      recognition.interimResults = false;
      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById("prompt").value = transcript;
        askGemini();
      };
      recognition.onerror = function(event) {
        alert("STT Error: " + event.error);
      };
      recognition.start();
    }

    async function askGemini() {
      const promptText = document.getElementById("prompt").value.trim();
      const responseEl = document.getElementById("response");
      if (!promptText) return;
      stopSpeaking();
      responseEl.textContent = "Thinking... 🤔";

      try {
        const response = await fetch("https://eduspark-chatbot-full-be.onrender.com/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: promptText })
        });

        const data = await response.json();
        let reply = data?.reply || "No response!";
        reply = reply.replace(/\*\*(.*?)\*\*/g, '$1')
                     .replace(/__(.*?)__/g, '$1')
                     .replace(/`{1,3}(.*?)`{1,3}/g, '$1');
        lastResponse = reply;
        responseEl.textContent = reply;
        speakResponse(reply);
      } catch (err) {
        responseEl.textContent = "❌ ERROR: " + err.message;
      }
    }

    function speakResponse(text) {
      stopSpeaking();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = getSelectedLang();
      currentUtterance = utter;
      synth.speak(utter);
    }

    function stopSpeaking() {
      if (synth.speaking || synth.paused) synth.cancel();
    }

    function speakLastResponse() {
      if (lastResponse) speakResponse(lastResponse);
    }
  </script>
</body>
</html>
